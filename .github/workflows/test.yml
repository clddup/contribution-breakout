name: Test contribution breakout

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: '10'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Verify the committed JavaScript matches the TypeScript sources
        run: git diff --exit-code -- action-dist
      - name: Run the action against GitHub
        uses: ./
        with:
          output_dir: test-output
      - name: Verify both images were generated
        run: |
          test -s test-output/breakout-light.svg
          test -s test-output/breakout-dark.svg
